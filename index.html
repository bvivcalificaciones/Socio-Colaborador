<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sumate como Socio Colaborador · Bomberos Voluntarios Isla Verde</title>
<meta name="description" content="Adherite al Bono Socio Colaborador de la Asoc. Bomberos Voluntarios de Isla Verde.">
<style>
  :root{
    --rojo:#c62828; --rojo-osc:#8e1b1b; --texto:#1f2328; --gris:#6b7280;
    --borde:#d1d5db; --fondo:#f6f6f4; --ok:#1b7f3b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--texto);background:var(--fondo);line-height:1.5}
  header{background:var(--rojo);color:#fff;padding:32px 20px 56px;text-align:center}
  header img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:50%;padding:6px}
  header h1{margin:14px 0 6px;font-size:1.6rem;line-height:1.2}
  header p{margin:0;opacity:.92}
  main{max-width:520px;margin:-36px auto 40px;padding:0 16px}
  .card{background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08);padding:24px}
  .precio{display:flex;align-items:baseline;gap:6px;justify-content:center;margin:0 0 6px}
  .precio strong{font-size:2.2rem;color:var(--rojo)}
  .sub{text-align:center;color:var(--gris);margin:0 0 20px;font-size:.95rem}
  label{display:block;font-weight:600;margin:14px 0 4px;font-size:.95rem}
  .ayuda{font-weight:400;color:var(--gris);font-size:.85rem}
  input[type=text],input[type=email],input[type=tel]{width:100%;padding:12px;border:1px solid var(--borde);border-radius:8px;font-size:1rem}
  input:focus{outline:2px solid var(--rojo);border-color:transparent}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-weight:400;font-size:.9rem}
  .check input{margin-top:4px;width:18px;height:18px;flex:none}
  .hp{position:absolute;left:-9999px}
  button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:var(--rojo);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer}
  button:hover{background:var(--rojo-osc)}
  button:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:14px;text-align:center;font-size:.95rem}
  .msg.error{color:var(--rojo)}
  .msg.ok{color:var(--ok)}
  .msg a{color:var(--rojo);font-weight:700}
  footer{text-align:center;color:var(--gris);font-size:.8rem;padding:0 16px 30px}
</style>
</head>
<body>

<header>
  <!-- Reemplazá logo.png por el logo del cuartel (mismo nombre, en la misma carpeta) -->
  <img src="logo.png" alt="Logo Bomberos Voluntarios Isla Verde" onerror="this.style.display='none'">
  <h1>Sumate como Socio Colaborador</h1>
  <p>Con tu aporte mensual sostenés a los Bomberos Voluntarios de Isla Verde 🚒</p>
</header>

<main>
  <div class="card">
    <p class="precio"><strong id="monto"></strong><span>/ mes</span></p>
    <p class="sub">Completá tus datos y después confirmás el pago con débito o crédito en Mercado Pago.</p>

    <form id="form" novalidate>
      <label for="nombre">Nombre y apellido</label>
      <input type="text" id="nombre" name="nombre" autocomplete="name" required maxlength="100">

      <label for="dni">DNI <span class="ayuda">(solo números)</span></label>
      <input type="text" id="dni" name="dni" inputmode="numeric" pattern="\d{7,8}" required maxlength="8">

      <label for="telefono">Teléfono / WhatsApp</label>
      <input type="tel" id="telefono" name="telefono" autocomplete="tel" required maxlength="25">

      <label for="email">Correo electrónico <span class="ayuda">— usá el mismo de tu cuenta de Mercado Pago</span></label>
      <input type="email" id="email" name="email" autocomplete="email" required maxlength="120">

      <label for="domicilio">Domicilio</label>
      <input type="text" id="domicilio" name="domicilio" autocomplete="street-address" required maxlength="150">

      <!-- Trampa anti-spam: los humanos no la ven -->
      <input class="hp" type="text" name="web" tabindex="-1" autocomplete="off">

      <label class="check">
        <input type="checkbox" id="consentimiento" required>
        <span>Acepto que la Asoc. Bomberos Voluntarios de Isla Verde use estos datos solo para gestionar mi adhesión como socio colaborador.</span>
      </label>

      <button type="submit" id="enviar">Continuar a Mercado Pago</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
  </div>
</main>

<footer>Asoc. Bomberos Voluntarios de Isla Verde</footer>

<script>
  /* ====== CONFIGURACIÓN: lo único que tenés que tocar ====== */
  const CONFIG = {
    // URL de la implementación de Apps Script (termina en /exec)
    SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyyyDzC0TbNP4_KNzVXO7hmP9I4NCpuiQXpd9nqz41CMX2ejXHllmdSFoTiExFGRB6mVA/exec",
    // Link de la suscripción "Bono Socio Colaborador" en Mercado Pago
    MP_URL: "https://mpago.la/2GkW3Cy",
    MONTO: "$ 4.000"
  };
  /* ========================================================= */

  document.getElementById("monto").textContent = CONFIG.MONTO;

  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("enviar");

  function mostrar(texto, tipo){ msg.className = "msg " + (tipo||""); msg.innerHTML = texto; }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = form.elements;
    const dni = f.dni.value.replace(/\D/g, "");
    f.dni.value = dni;

    if (!f.nombre.value.trim() || !f.telefono.value.trim() || !f.domicilio.value.trim())
      return mostrar("Completá todos los campos.", "error");
    if (!/^\d{7,8}$/.test(dni))
      return mostrar("Revisá el DNI: tienen que ser 7 u 8 números.", "error");
    if (!f.email.checkValidity() || !f.email.value)
      return mostrar("Revisá el correo electrónico.", "error");
    if (!document.getElementById("consentimiento").checked)
      return mostrar("Tenés que aceptar el uso de los datos para continuar.", "error");

    btn.disabled = true;
    mostrar("Guardando tus datos…");

    const datos = new URLSearchParams({
      nombre: f.nombre.value.trim(),
      dni,
      telefono: f.telefono.value.trim(),
      email: f.email.value.trim().toLowerCase(),
      domicilio: f.domicilio.value.trim(),
      web: f.web.value
    });

    try {
      await fetch(CONFIG.SCRIPT_URL, { method: "POST", mode: "no-cors", body: datos });
      mostrar('¡Listo! Te llevamos a Mercado Pago… Si no pasa nada, <a href="' + CONFIG.MP_URL + '">tocá acá</a>.', "ok");
      setTimeout(() => { window.location.href = CONFIG.MP_URL; }, 1200);
    } catch (err) {
      btn.disabled = false;
      mostrar("No pudimos guardar los datos. Revisá tu conexión e intentá de nuevo.", "error");
    }
  });
</script>
</body>
</html>
